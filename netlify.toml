[build]
    command = "hugo"
    publish = "public"

[build.environment]
  NODE_VERSION = "22"
  HUGO_VERSION = "0.159.2"

[context]
[context.branch-deploy]
command = "hugo -F -b $DEPLOY_PRIME_URL"
[context.deploy-preview]
command = "hugo -F -b $DEPLOY_PRIME_URL"
[context.production]
[context.production.environment]
HUGO_ENV = "production"
